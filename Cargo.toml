[package]
name = "how-to-mcd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Open-source home cooking recipes and a read-only McDonald's China MCP-powered Rust CLI"
repository = "https://github.com/hu-qi/how-to-mcd"
rust-version = "1.88"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
lto = "thin"
