[package]
name = "how-to-mcd"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Rust-powered community home cooking workbench with a read-only McDonald's China MCP client"
repository = "https://github.com/hu-qi/how-to-mcd"
rust-version = "1.88"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
