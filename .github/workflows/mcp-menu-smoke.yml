name: Real McDonald's Store Menu Smoke
# The official MCP can return text guidance before structured JSON blocks.
# Keep diagnostics capped and redacted; this never creates orders.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/mcp-menu-smoke.yml
      - scripts/mcp-menu-verify.mjs
      - src/shop.rs
      - scripts/mcp-menu-verify.mjs
      - web/shop.js
      - web/home-guides.js
      - recipes/**

permissions:
  contents: read

jobs:
  menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check verifier fixtures without credentials
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { selectedStore, menuCounts, menuGuideCoverage } from './scripts/mcp-menu-verify.mjs';
          assert.deepEqual(selectedStore([{storeCode:'test',beCode:'CN',businessStatus:true}]),
            {storeCode:'test',beCode:'CN',orderType:1,beType:1});
          assert.deepEqual(menuCounts({meals:{'100':{name:'fixture'}},categories:[{name:'fixture'}]}),
            {productCount:1,categoryCount:1});
          const { parseBusinessText } = await import('./scripts/mcp-menu-verify.mjs');
          assert.equal(parseBusinessText('门店帮助文字\\n{"success":true,"code":200,"data":{"x":1}}').data.x, 1);
          assert.equal(parseBusinessText('not valid {guidance}'), null);
          assert.deepEqual(selectedStore({ data: { storeList: [{storeCode:'nested',businessStatus:true}] } }),
            {storeCode:'nested',beCode:'',orderType:1,beType:1});
          assert.deepEqual(menuGuideCoverage({
            meals: {
              x: {name:'麦乐鸡'}, y: {name:'不公开配方的新产品'},
              z: {name:'矿泉水'}
            }
          }), {products:3,fullRecipe:1,categoryOnly:1,unknown:1});
          console.log('Read-only menu verifier fixture and community coverage passed');
          EOF
      - name: Query genuine nearby stores and live menu (read-only)
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MCD_MCP_TOKEN" ]; then echo "::error::Configure MCD_MCP_TOKEN"; exit 1; fi
          umask 077
          cargo run --quiet -- mcp call query-nearby-stores --args '{"searchType":2,"beType":1,"city":"北京市","keyword":"朝阳区"}' > "$RUNNER_TEMP/stores.json"
          node scripts/mcp-menu-verify.mjs stores "$RUNNER_TEMP/stores.json" > "$RUNNER_TEMP/menu-args.json"
          cargo run --quiet -- mcp call query-meals --args "$(cat "$RUNNER_TEMP/menu-args.json")" > "$RUNNER_TEMP/store-menu.json"
          HOWTOMCD_AUDIT_PUBLIC_NAMES=1 node scripts/mcp-menu-verify.mjs menu "$RUNNER_TEMP/store-menu.json"
          rm -f "$RUNNER_TEMP/stores.json" "$RUNNER_TEMP/menu-args.json" "$RUNNER_TEMP/store-menu.json"
