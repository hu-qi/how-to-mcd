name: Rust WASM Demo and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - name: Compile shared Rust recipes to WebAssembly
        run: wasm-pack build crates/howtomcd-wasm --target web --release --out-dir ../../site/pkg --no-opt
      - name: Assemble safe public demo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets
          cp web/index.html site/index.html
          cp web/app.js site/assets/app.js
          cp web/shop.js site/assets/shop.js
          cp web/nutrition-core.js site/assets/nutrition-core.js
          cp web/home-guides.js site/assets/home-guides.js
          cp web/app.css site/assets/app.css
          touch site/.nojekyll
          test -s site/pkg/howtomcd_wasm_bg.wasm
          test -s site/pkg/howtomcd_wasm.js
          node --check site/assets/app.js
          node --check site/assets/shop.js
          node --check site/assets/nutrition-core.js
          node scripts/test-nutrition-core.cjs
          node --check site/assets/home-guides.js
          node scripts/test-home-guides.cjs
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { extractRows } from './scripts/publish-nutrition.mjs';
          const sample = {content:[{type:'text',text:JSON.stringify({success:true,code:200,data:'[1]{productName,nutritionDescription,energyKj,energyKcal,protein,fat,carbohydrate,sodium,calcium}:\n  猪柳麦满分,null,1288,308,16,16,24,781,213'})}]};
          const result = extractRows(sample, '2026-10-18T00:00:00Z');
          assert.equal(result.total,1);
          assert.equal(result.products[0].name,'猪柳麦满分');
          assert.equal(result.products[0].energyKcal,308);
          assert.equal(result.products[0].sodium,781);
          console.log('Official MCP TOON public parser fixture passed');
          EOF
      - name: Obtain sanitized REAL McDonald's nutrition catalogue with Actions secret
        if: github.event_name != 'pull_request'
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MCD_MCP_TOKEN" ]; then
            echo "::error::Configure MCD_MCP_TOKEN as a repository secret"
            exit 1
          fi
          umask 077
          success=false
          for attempt in 1 2 3; do
            echo "Read-only official nutrition sync attempt $attempt of 3"
            if cargo run --quiet -- mcp nutrition > "$RUNNER_TEMP/private-nutrition-response.json"; then
              if node scripts/publish-nutrition.mjs "$RUNNER_TEMP/private-nutrition-response.json" site/catalog/nutrition.json; then
                success=true
                break
              fi
            fi
            rm -f "$RUNNER_TEMP/private-nutrition-response.json" site/catalog/nutrition.json
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          rm -f "$RUNNER_TEMP/private-nutrition-response.json"
          if [ "$success" != true ]; then
            echo "::error::Official nutrition sync failed after three attempts. Refusing to publish unverified data."
            exit 1
          fi
          test -s site/catalog/nutrition.json
      - name: Configure publicly hosted Rust API endpoint (URL only)
        env:
          PUBLIC_MCP_API_URL: ${{ vars.HOWTOMCD_PUBLIC_API_URL }}
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { writeFileSync } from 'node:fs';
          // Default to the production Rust gateway after external smoke checks.
          // Repository variable can override its public origin (never a token).
          const raw = process.env.PUBLIC_MCP_API_URL || 'https://how-to-mcd-api.vercel.app';
          const url = new URL(raw);
          if (url.protocol !== 'https:' || url.username || url.password ||
              url.search || url.hash || url.pathname !== '/') {
            throw Error('HOWTOMCD_PUBLIC_API_URL must be an HTTPS origin');
          }
          const healthResponse = await fetch(url.origin + '/api/health', {
            headers: { Origin: 'https://hu-qi.github.io' }
          });
          if (!healthResponse.ok) throw Error('Public Rust API health check failed');
          const health = await healthResponse.json();
          if (health.service !== 'how-to-mcd-public-api' || health.server_token_used !== false) {
            throw Error('Public Rust gateway identity or personal-token mode mismatch');
          }
          writeFileSync('site/api-config.json',
            JSON.stringify({ apiBase: url.origin }));
          console.log('Public Rust HTTPS API origin configured (no credentials included).');
          EOF
      - name: Execute real Rust/WASM recipe calculations in Node.js
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const wasm = await import('./site/pkg/howtomcd_wasm.js');
          await wasm.default(readFileSync('./site/pkg/howtomcd_wasm_bg.wasm'));
          const list = JSON.parse(wasm.recipes_json());
          assert.equal(list.length, 23);
          const scaled = JSON.parse(wasm.recipe_json('chicken-burger', 4));
          assert.equal(scaled.requested_servings, 4);
          assert.equal(scaled.ingredients[0].amount, 600);
          const match = JSON.parse(wasm.suggestions_json('鸡腿、面包、生菜'));
          assert.equal(match[0].id, 'chicken-burger');
          assert.ok(match[0].matched_count >= 3);
          let invalidRejected = false;
          try { wasm.recipe_json('chicken-burger', 0); } catch (_) { invalidRejected = true; }
          assert.equal(invalidRejected, true);
          console.log('Rust WebAssembly recipe test passed.');
          EOF
      - name: Upload public demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: howtomcd-public-demo
          path: site/
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download vetted demo artifact
        uses: actions/download-artifact@v4
        with:
          name: howtomcd-public-demo
          path: site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  browser-live-shop:
    # Only after the reviewed main branch has been deployed on GitHub Pages.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium for live browser smoke
        run: |
          mkdir -p /tmp/howtomcd-live-shop
          cd /tmp/howtomcd-live-shop
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate published Pages, real menu, and read-only quote
        env:
          PLAYWRIGHT_PACKAGE_ROOT: /tmp/howtomcd-live-shop/node_modules/playwright
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
          HOWTOMCD_SITE_URL: https://hu-qi.github.io/how-to-mcd/
        run: |
          if [ -z "$MCD_MCP_TOKEN" ]; then
            echo "::error::MCD_MCP_TOKEN Actions secret missing"
            exit 1
          fi
          node scripts/verify-published-shop.mjs
