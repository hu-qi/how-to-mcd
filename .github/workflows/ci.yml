name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile CLI and Rust web server
        run: cargo check --all-targets
      - name: Unit and HTTP API tests
        run: cargo test --all-targets
      - name: Validate recipe collection
        run: cargo run -- validate
      - name: Rust web workbench smoke test
        shell: bash
        run: |
          set -euo pipefail
          cargo run -- serve --host 127.0.0.1 --port 3100 > /tmp/howtomcd-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3100/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Rust HTTP server did not become ready"
            cat /tmp/howtomcd-web.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:3100/ | grep -q "HOW TO MCD"
          curl -fsS http://127.0.0.1:3100/assets/app.css | grep -q "recipe-card"
          curl -fsS http://127.0.0.1:3100/assets/app.js | grep -q "chooseRecipe"
          curl -fsS http://127.0.0.1:3100/assets/home-guides.js | grep -q "HowToMCDGuides"
          curl -fsS http://127.0.0.1:3100/api/recipes/chicken-burger?servings=4 | grep -Eq '"amount":600(\.0)?'
          curl -fsS 'http://127.0.0.1:3100/api/suggestions?ingredients=potato' >/dev/null
          echo "Rust web, pantry match and server-side ingredient scaling verified"
      - name: Audit accidental plaintext bearer credentials
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=target --exclude='Cargo.lock' 'Bearer[[:space:]]+[A-Za-z0-9_-]{20,}' .; then
            echo "Potential hardcoded bearer credential detected"
            exit 1
          fi
