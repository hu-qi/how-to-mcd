name: MCP Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/mcp-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check repository secret presence
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
        shell: bash
        run: |
          if [ -z "$MCD_MCP_TOKEN" ]; then
            echo "::error::Configure Actions repository secret MCD_MCP_TOKEN first"
            exit 1
          fi
      - name: Diagnose remote MCP initialization HTTP status (no response body)
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"howtomcd-ci","version":"0.2.0"}}}'
          if status=$(curl --proto '=https' --silent --show-error --connect-timeout 10 --max-time 25 \
            --request POST 'https://mcp.mcd.cn' \
            --header "Authorization: Bearer $MCD_MCP_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data "$payload" --output /dev/null \
            --write-out 'HTTP %{http_code}; Content-Type %{content_type}'); then
            echo "Remote MCP initialization probe: $status"
          else
            echo "::warning::Remote MCP initialize request could not complete at the HTTP transport layer."
          fi
      - name: Discover supported tools over authenticated MCP
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -- mcp tools > "$RUNNER_TEMP/mcp-tools.json"
          jq -e '.tools | index("list-nutrition-foods") != null' "$RUNNER_TEMP/mcp-tools.json" >/dev/null
          jq -e '.tools | index("query-meals") != null' "$RUNNER_TEMP/mcp-tools.json" >/dev/null
          echo "Remote MCP initialization and public tool discovery passed."
      - name: Query official nutrition over authenticated MCP
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -- mcp nutrition > "$RUNNER_TEMP/mcp-nutrition.json"
          jq -e '(.isError // false) == false and (.content | type == "array" and length > 0)' "$RUNNER_TEMP/mcp-nutrition.json" >/dev/null
          echo "Official nutrition tool returned content successfully."
